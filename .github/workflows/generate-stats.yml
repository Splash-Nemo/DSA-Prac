name: Generate DSA Statistics from LeetCode

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Fetch LeetCode stats
        run: |
          python3 << 'EOF'
          import requests
          import json
          from datetime import datetime
          
          USERNAME = "ap457codes"
          
          url = f"https://leetcode-stats-api.herokuapp.com/{USERNAME}"
          
          try:
              response = requests.get(url, timeout=10)
              response.raise_for_status()
              
              data = response.json()
              
              stats = {
                  "username": USERNAME,
                  "total": data["totalSolved"],
                  "by_difficulty": {
                      "easy": data["easySolved"],
                      "medium": data["mediumSolved"],
                      "hard": data["hardSolved"],
                  },
                  "acceptance_rate": data["acceptanceRate"],
                  "ranking": data["ranking"],
                  "last_updated": datetime.now().isoformat(),
                  "source": "LeetCode"
              }
              
              with open('stats.json', 'w') as f:
                  json.dump(stats, f, indent=2)
              
              print(f"✅ Fetched stats for {USERNAME}")
              print(f"Total problems solved: {stats['total']}")
              print(f"Easy: {stats['by_difficulty']['easy']}")
              print(f"Medium: {stats['by_difficulty']['medium']}")
              print(f"Hard: {stats['by_difficulty']['hard']}")
          
          except Exception as e:
              print(f"❌ Error fetching LeetCode data: {e}")
              exit(1)
          EOF

      - name: Commit and push stats
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add stats.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update LeetCode statistics" && git push)
